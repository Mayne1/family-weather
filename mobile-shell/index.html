<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071b25" />
    <title>Family Weather</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 28px; background: #071b25; color: #fffdf8; }
      main { width: min(460px, 100%); text-align: center; }
      .mark { width: 76px; height: 76px; margin: 0 auto 24px; display: grid; place-items: center; border: 2px solid #f3c34f; border-radius: 24px; color: #f3c34f; font-size: 38px; }
      h1 { margin: 0 0 12px; font-family: Georgia, serif; font-size: 42px; }
      p { margin: 0; color: #c7d7d5; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">☀</div>
      <h1>Family Weather</h1>
      <p>The native workspace is ready. Connect a development server to begin building the mobile experience.</p>
    </main>
  </body>
</html>
