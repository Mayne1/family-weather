name: Family Weather Android test build

on:
  workflow_dispatch:
  push:
    branches:
      - codex/reply-notifications
      - codex/lock-screen-widgets
    paths:
      - "mobile/**"
      - "mobile-shell/**"
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-android-debug.yml"

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out Family Weather
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build and synchronize mobile assets
        run: npm run mobile:build

      - name: Restore stable Family Weather test signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode .github/debug/family-weather-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          base64 --decode .github/debug/family-weather-debug.keystore.b64 > android/family-weather-widget-test.keystore
          chmod 600 android/family-weather-widget-test.keystore

      - name: Build Android debug app
        working-directory: android
        run: ./gradlew testWidgetPreviewUnitTest assembleWidgetPreview

      - name: Verify the fixed widget-test signing identity
        run: |
          signing_tool="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          fingerprint="$($signing_tool verify --print-certs android/app/build/outputs/apk/widgetPreview/app-widgetPreview.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test "$fingerprint" = "52d0acd237d956e1cc3feeaa2b387d75a68e015117fd0bdc51dcb12f0df7d39b"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: family-weather-android-widget-preview
          path: android/app/build/outputs/apk/widgetPreview/app-widgetPreview.apk
          if-no-files-found: error
