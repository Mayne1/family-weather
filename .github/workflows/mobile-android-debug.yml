name: Family Weather Android test build

on:
  workflow_dispatch:
  push:
    branches:
      - codex/reply-notifications
    paths:
      - "mobile/**"
      - "mobile-shell/**"
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-android-debug.yml"

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out Family Weather
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build and synchronize mobile assets
        run: npm run mobile:build

      - name: Build Android debug app
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: family-weather-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
