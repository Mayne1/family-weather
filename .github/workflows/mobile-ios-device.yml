name: Family Weather iOS device test build

on:
  workflow_dispatch:
  push:
    branches: [codex/ios-android-parity, codex/reply-notifications, codex/complete-brand-timezones-20261110]
    paths:
      - "mobile/**"
      - "ios/**"
      - "android/app/build.gradle"
      - "public/**"
      - "app/invitations/**"
      - "capacitor.config.ts"
      - "package*.json"
      - ".github/workflows/mobile-ios-device.yml"

permissions:
  contents: read

jobs:
  device-debug:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build shared app and synchronize iOS
        run: |
          npx vite build --config mobile/vite.config.mts
          npx cap sync ios
      - name: Compile device app at Android's Debug testing stage
        run: |
          set -o pipefail
          xcode_app="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort | tail -1)"
          test -n "$xcode_app"
          export DEVELOPER_DIR="$xcode_app/Contents/Developer"
          xcodebuild -version
          mkdir -p build
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device CODE_SIGNING_ALLOWED=NO \
            build | tee build/ios-device-debug.log
          mkdir -p build/device-package/Payload
          ditto build/ios-device/Build/Products/Debug-iphoneos/App.app build/device-package/Payload/App.app
          cd build/device-package
          zip -qr ../Family-Weather-iOS-v10-unsigned.ipa Payload
      - name: Save iPhone device test package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-weather-ios-device-debug
          path: |
            build/Family-Weather-iOS-v10-unsigned.ipa
            build/ios-device-debug.log
          if-no-files-found: warn
          retention-days: 30
