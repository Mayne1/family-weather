<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Family Weather — Clean</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div style="max-width:900px;margin:0 auto;padding:16px;">
    <h1 style="margin:0 0 6px 0;">Family Weather (Clean)</h1>
    <div style="opacity:.8;margin-bottom:12px;">This is the new clean page. Old page is untouched.</div>

    <div class="card" style="padding:14px;margin-bottom:12px;">
      <div><strong id="label">—</strong></div>
      <div style="opacity:.8" id="coords">—</div>
      <div style="margin-top:8px" id="status">Loading…</div>
    </div>

    <div class="card" style="padding:14px;">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <input id="zip" inputmode="numeric" maxlength="5" placeholder="ZIP (e.g., 95377)"
               style="width:160px;padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:inherit;">
        <button class="btn" id="btnZip" type="button">Use ZIP</button>
        <button class="btn" id="btnDevice" type="button">Use Device Location</button>
      </div>
      <div style="margin-top:10px;opacity:.8">
        For now this page only proves wiring works. We’ll add Right Now + 10-day next.
      </div>
    </div>
  </div>

  <script src="./home-clean.js" defer></script>
</body>
</html>
